<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title> Weather App</title>
    <link rel="stylesheet" href="weather.css">
</head>

<body>
    <div class="card">
        <h1 class="title">Weather App</h1>
        <div class="search">
            <input type="text" id="cityInput" placeholder="Enter City Name">
            <button id="searchButton"><img src="images/search.png" class="search-icon"></button>
        </div>

        <div class="weather">
            <img src="images/weather.png" class="weather-icon">
            <h1 class="temperature">Temperature</h1>
            <h2 class="city">City Name</h2>
            <p class="description">Description</p>
            <div class="range">
                <span class="maximum-temp">H:</span>
                <span class="minimum-temp">L:</span>
            </div>

            <div class=" details">
                <div class="col">
                    <img src="images/humidity.png">
                    <div>
                        <p class="humidity"></p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/wind.png">
                    <div>
                        <p class="wind"></p>
                        <p> Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="weather.js"></script>
</body>


</html>
